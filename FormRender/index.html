
<!DOCTYPE html>
<html>

<head>
    <title>Product Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        form {
            padding: 25px;
            border: 1px solid #ddd;
        }

        fieldset {
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 15px;
        }

        legend {
            font-size: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 220px 1fr;
            align-items: center;
            margin-bottom: 10px;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        textarea,
        select {
            padding: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"] {
            width: 275px;
        }

        textarea {
            width: 100%;
            height: 140px;
        }

        button {
            background-color: blue;
            color: white;
            font-size: 18px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .submit-row {
            text-align: right;
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <form action="https://teach-backend-fawn.vercel.app/api/product"
          method="POST"
          enctype="multipart/form-data">

        <fieldset>

            <legend>General Info</legend>

            <div class="form-row">
                <label for="itemName">Item Name</label>

                <input type="text"
                       id="itemName"
                       name="itemName">
            </div>

            <div class="form-row">
                <label for="itemDescription">Description</label>

                <textarea id="itemDescription"
                          name="itemDescription"></textarea>
            </div>

            <div class="form-row">
                <label for="category">Category</label>

                <select id="category" name="category">
                    <option value="notSpecified">notSpecified</option>
                    <option value="consumption">consumption</option>
                    <option value="household">household</option>
                    <option value="electronic">electronic</option>
                    <option value="gadget">gadget</option>
                </select>
            </div>

        </fieldset>


        <fieldset>

            <legend>Misc.</legend>

            <div class="form-row">
                <label for="inventoryAmount">Inventory Amount</label>

                <input type="number"
                       id="inventoryAmount"
                       name="inventoryAmount">
            </div>

            <div class="form-row">
                <label for="listPrice">List price</label>

                <input type="number"
                       id="listPrice"
                       name="listPrice">
            </div>

            <div class="form-row">
                <label>Available Stores</label>

                <div>
                    <input type="checkbox"
                           id="bangkok"
                           name="availableStore[]"
                           value="Bangkok">
                    <label for="bangkok">Bangkok</label>

                    <input type="checkbox"
                           id="pattaya"
                           name="availableStore[]"
                           value="Pattaya">
                    <label for="pattaya">Pattaya</label>

                    <input type="checkbox"
                           id="phuket"
                           name="availableStore[]"
                           value="Phuket">
                    <label for="phuket">Phuket</label>
                </div>
            </div>

            <div class="form-row">
                <label>Available Stores</label>

                <div>
                    <input type="radio"
                           id="active"
                           name="status"
                           value="Active">
                    <label for="active">Active</label>

                    <input type="radio"
                           id="inactive"
                           name="status"
                           value="Inactive">
                    <label for="inactive">Inactive</label>
                </div>
            </div>

        </fieldset>


        <fieldset>

            <legend>Staff</legend>

            <div class="form-row">
                <label for="staffEmail">Staff Email</label>

                <input type="email"
                       id="staffEmail"
                       name="staffEmail">
            </div>

        </fieldset>


        <div class="submit-row">
            <button type="submit">Submit Form</button>
        </div>

    </form>

</body>
</html>
